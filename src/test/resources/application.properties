spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false

jwt.secret=testSecretKeyForJWTTokenGeneration12345678
jwt.expiration=86400000

qr.encryption.key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODk=
qr.ttl.minutes=30

whatsapp.template.transaction-receipt=test_receipt
whatsapp.template.qr-delivery=test_qr

app.storage.type=local
app.storage.kyc.path=./data/kyc

spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration
spring.ai.openai.api-key=test-placeholder
almukhtar.ai.enabled=false
