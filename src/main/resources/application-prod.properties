# PostgreSQL Database Configuration for Production
spring.datasource.url=jdbc:postgresql://localhost:5432/tahsilat_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=tahsilat_user
spring.datasource.password=tahsilat_password

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# JWT Configuration
jwt.secret=myVerySecretKeyForJWTTokenGeneration12345
jwt.expiration=86400000

# Logging level
logging.level.org.springframework=INFO
logging.level.com.mycompany.transfersystem=DEBUG

# Flyway for production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring AI (optional - set OPENAI_API_KEY env var)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.initialize-schema=true

# WhatsApp (set env vars to enable)
# whatsapp.api.base-url=https://graph.facebook.com/v20.0
# whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
# whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
