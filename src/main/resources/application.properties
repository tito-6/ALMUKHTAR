# In-memory H2 Database for development
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# JWT Configuration
jwt.secret=myVerySecretKeyForJWTTokenGeneration12345
jwt.expiration=86400000

# Logging level
logging.level.org.springframework=INFO

# Flyway - disabled for H2 dev (migrations use PostgreSQL syntax)
spring.flyway.enabled=false

# QR encryption (generate with: openssl rand -base64 32)
qr.encryption.key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODk=
qr.ttl.minutes=30

# WhatsApp (optional - uncomment and set env vars to enable)
# whatsapp.api.base-url=https://graph.facebook.com/v20.0
# whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
# whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.template.transaction-receipt=almukhtar_receipt_v1
whatsapp.template.qr-delivery=almukhtar_qr_delivery_v1

# KYC document storage (local filesystem for dev)
app.storage.type=local
app.storage.kyc.path=./data/kyc

# Redis (optional - disable auto-config when not running Redis)
spring.data.redis.repositories.enabled=false