# In-memory H2 Database for development
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# JWT Configuration
jwt.secret=myVerySecretKeyForJWTTokenGeneration12345
jwt.expiration=86400000

# Logging level
logging.level.org.springframework=INFO

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Flyway - disabled for H2 dev (migrations use PostgreSQL syntax)
spring.flyway.enabled=false

# QR encryption (generate with: openssl rand -base64 32)
qr.encryption.key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODk=
qr.ttl.minutes=30

# WhatsApp: use mock locally; set whatsapp.provider.type=meta and credentials for Cloud API.
whatsapp.provider.type=mock
whatsapp.api.base-url=https://graph.facebook.com/v20.0
# whatsapp.api.phone-number-id=
# whatsapp.api.access-token=
whatsapp.webhook.verify-token=
whatsapp.webhook.app-secret=

# WhatsApp (optional - uncomment and set env vars to enable)
# whatsapp.api.base-url=https://graph.facebook.com/v20.0
# whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
# whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.template.transaction-receipt=almukhtar_receipt_v1
# Offline cashier device verification (optional; when set, deviceSignature is required on sync)
offline.device.hmac-secret=
offline.sync.max-applied-per-day=500
offline.sync.max-amount-per-tx=1000000

# Freeze / dispute deep link base for customer-visible case IDs
app.freeze.dispute-base-url=https://almukhtar.app/disputes?case=

whatsapp.template.ops-notice=almukhtar_ops_notice_v1

# KYC document storage (local filesystem for dev)
app.storage.type=local
app.storage.kyc.path=./data/kyc

# Redis (optional - disable auto-config when not running Redis)
spring.data.redis.repositories.enabled=false

